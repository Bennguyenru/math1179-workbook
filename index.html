<style>

<header class="top"><div class="top-in">
  <div class="brand"><b>MATH1179</b><span>Tài liệu ôn tập · Mathematics for Computer Science</span></div>

<script>
/* ===== Engine: parsers + checkers (pure, testable in node) ===== */
var SUP = {'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁻':'-'};
function normMath(s){
  s = String(s).trim();
  s = s.replace(/[−–]/g,'-').replace(/[×·✕]/g,'*').replace(/÷/g,'/').replace(/π/g,'pi').replace(/√/g,'sqrt ');
  s = s.replace(/([⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g, function(m){ return '^(' + m.split('').map(function(c){return SUP[c];}).join('') + ')'; });
  return s;
}
var FUNCS = {sqrt:Math.sqrt, sin:Math.sin, cos:Math.cos, tan:Math.tan, ln:Math.log, log:Math.log10, log2:Math.log2, log10:Math.log10, abs:Math.abs, exp:Math.exp};
function tokenize(s){
  var t = [], i = 0, m;
  while (i < s.length){
    var c = s[i];
    if (/\s/.test(c)){ i++; continue; }
    if ((m = /^(\d+\.?\d*|\.\d+)/.exec(s.slice(i)))){ t.push({k:'n', v:parseFloat(m[1])}); i += m[1].length; continue; }
    if ((m = /^[A-Za-z_][A-Za-z_0-9]*/.exec(s.slice(i)))){ t.push({k:'id', v:m[0]}); i += m[0].length; continue; }
    if ('+-*/^()'.indexOf(c) >= 0){ t.push({k:c}); i++; continue; }
    throw new Error('Ký tự không hợp lệ: ' + c);
  }
  return t;
}
function evalExpr(str, vars){
  vars = vars || {};
  var s = normMath(str);
  /* scientific notation like 4.62e16 or 4.62E-3 */
  s = s.replace(/(\d)\s*[eE]\s*([+-]?\d+)/g, '$1*10^($2)');
  var t = tokenize(s), p = 0;
  function peek(){ return t[p]; }
  function startsAtom(tk){ return tk && (tk.k==='n' || tk.k==='id' || tk.k==='('); }
  function expr(){ var v = term(); while (peek() && (peek().k==='+'||peek().k==='-')){ var o=t[p++].k; var r=term(); v = o==='+'? v+r : v-r; } return v; }
  function term(){ var v = unary(); for(;;){ var tk = peek(); if (tk && (tk.k==='*'||tk.k==='/')){ p++; var r = unary(); v = tk.k==='*'? v*r : v/r; } else if (startsAtom(tk)){ v = v*power(); } else break; } return v; }
  function unary(){ var tk = peek(); if (tk && (tk.k==='-'||tk.k==='+')){ p++; var v = unary(); return tk.k==='-'? -v : v; } return power(); }
  function power(){ var b = atom(); if (peek() && peek().k==='^'){ p++; var e = unary(); return Math.pow(b, e); } return b; }
  function atom(){
    var tk = t[p++];
    if (!tk) throw new Error('Biểu thức chưa đầy đủ');
    if (tk.k==='n') return tk.v;
    if (tk.k==='('){ var v = expr(); if (!peek() || peek().k!==')') throw new Error('Thiếu dấu )'); p++; return v; }
    if (tk.k==='id'){
      var id = tk.v;
      if (id==='pi') return Math.PI;
      if (FUNCS[id]){ var a = (peek() && peek().k==='(') ? atom() : power(); return FUNCS[id](a); }
      if (Object.prototype.hasOwnProperty.call(vars, id)) return vars[id];
      var prod = 1;
      for (var i=0;i<id.length;i++){ var ch = id[i]; if (!Object.prototype.hasOwnProperty.call(vars, ch)) throw new Error('Không hiểu ký hiệu "' + id + '"'); prod *= vars[ch]; }
      return prod;
    }
    throw new Error('Cú pháp chưa đúng');
  }
  var v = expr();
  if (p < t.length) throw new Error('Cú pháp chưa đúng gần "' + (t[p].v || t[p].k) + '"');
  return v;
}
/* Parse a numeric answer typed by a student */
function parseNum(input){
  var s = String(input).trim();

{n:9, p:'If I go out to work, I cannot study. Either I study or I complete my coursework but not both. I went out to work. Therefore I completed my coursework. (w: go out to work, s: study, c: complete coursework)', hint:'Dùng ⊕ cho "either ... or ... but not both".',
 parts:[LG('Premise 1', 'w→¬s', ['w','s','c']), LG('Premise 2', 's⊕c', ['w','s','c']), CHO('Argument', ['Valid', 'Invalid'], 0)],
 sol:'<p>w đúng nên ¬s đúng (s sai). s ⊕ c đúng mà s sai thì c đúng. Không có dòng nào tiền đề đúng mà kết luận sai: lập luận hợp lệ.</p>'},
{n:10, p:'s: I will go to school, i: I feel sick, w: I sleep twelve hours a day, e: I had too much exercise. "I will go to school if I do not feel sick. I sleep 12 hours a day and feel sick if and only if I have had too much exercise. I did not sleep 12 hours today. Therefore I did not have too much exercise and I will go to school."', hint:'"s if ¬i" là ¬i → s. Thử tìm một dòng các tiền đề đúng mà kết luận sai.',
 parts:[LG('Premise 1', '¬i→s', ['s','i','w','e']), LG('Premise 2', '(w∧i)↔e', ['s','i','w','e']), LG('Premise 3', '¬w', ['s','i','w','e']), LG('Conclusion', '¬e∧s', ['s','i','w','e']), CHO('Argument', ['Valid', 'Invalid'], 1)],
 sol:'<p>Phản ví dụ: s = F, i = T, w = F, e = F. ¬i → s = F → F = T; (w ∧ i) ↔ e = F ↔ F = T; ¬w = T. Kết luận ¬e ∧ s = T ∧ F = F. Vậy lập luận không hợp lệ (ốm thì có thể không đến trường).</p>'},
{n:11, p:'p and q are the inputs to the circuit: an OR gate (p, q) and an AND gate (p, q) followed by a NOT, both feeding a final AND gate. What is the output in simplest form?', hint:'Viết biểu thức cho từng cổng rồi ghép lại.',
 parts:[LG('Output', 'p⊕q', ['p','q'], '(p ∨ q) ∧ ¬(p ∧ q) = p ⊕ q')], sol:'<p>Đây chính là cổng XOR.</p>'},
{n:12, p:'Write the Boolean expression for each circuit and simplify. (i) p → NOT, AND with q, then NOT. (ii) p AND q, then NOT, then AND with the branch taken from p.', hint:'Dùng De Morgan và luật phân phối. Ở (ii), đường rẽ nhánh phía dưới xuất phát từ dây p.',
 parts:[LG('(i) Simplified output', 'p∨¬q', ['p','q'], '¬(¬p ∧ q) = p ∨ ¬q'), LG('(ii) Simplified output', 'p∧¬q', ['p','q'], '¬(p ∧ q) ∧ p = p ∧ ¬q'), O('Simplified circuits', '(i) Một cổng OR với đầu vào p và ¬q. (ii) Một cổng AND với đầu vào p và ¬q.')],
 sol:'<p>(ii) ¬(p ∧ q) ∧ p ≡ (¬p ∨ ¬q) ∧ p ≡ (¬p ∧ p) ∨ (¬q ∧ p) ≡ f ∨ (p ∧ ¬q) ≡ p ∧ ¬q.</p>'},
{n:'P1', sec:'Predicate logic', p:'Universe: all quadrilaterals. p(x): parallelogram, s(x): all sides equal, a(x): all angles equal, r(x): rectangle, q(x): square. Translate and decide the truth of each statement.', hint:'Nghĩ tới hình thoi (rhombus): 4 cạnh bằng nhau nhưng các góc không bằng nhau.',
 parts:[TF('(i) ∀x (s(x) → q(x))', false), TF('(ii) ∃x (s(x) ∧ a(x))', true), TF('(iii) ∃x (s(x) ∧ ¬p(x))', false), TF('(iv) ∀x ((s(x) ∧ a(x)) → q(x))', true), TF('(v) ∃x (a(x) ∧ ¬(r(x) ∨ q(x)))', false)],
 sol:'<p>(i) "Every quadrilateral with equal sides is a square": sai, phản ví dụ hình thoi. (ii) "Some quadrilateral has equal sides and equal angles": đúng, hình vuông. (iii) "Some equal-sided quadrilateral is not a parallelogram": sai, cạnh bằng nhau thì là hình thoi, luôn là hình bình hành. (iv) đúng theo định nghĩa hình vuông. (v) "Some equiangular quadrilateral is neither rectangle nor square": sai, bốn góc bằng nhau thì mỗi góc 90°, tức là hình chữ nhật.</p>'},
{n:'P2', p:'Sets E (employees), PT (project teams), J (job titles); predicates IsInProjectTeam(e, p), EmployedAs(e, j), Leader(e, p), ManagedBy(e, s). Represent the statements in predicate calculus.', hint:'"implies" là →, "either ... or" là ∨.',
 parts:[O('(i) If Jim is employed as a programmer then he will be working as a member of team2 and will be managed by Sally.', 'EmployedAs(Jim, programmer) → (IsInProjectTeam(Jim, team2) ∧ ManagedBy(Jim, Sally))'), O('(ii) Sally being leader of team2 implies she is a systems analyst or a C++ programmer.', 'Leader(Sally, team2) → (EmployedAs(Sally, systemsAnalyst) ∨ EmployedAs(Sally, C++Programmer))')]},
{n:'P3', p:'Universe: all fruit. j(x) juicy, y(x) yellow, r(x) red, g(x) grows on a tree, b(x) grows on a bush. Translate and give your opinion of the truth values.', hint:'Tìm một loại quả làm phản ví dụ.',
 parts:[O('(i) ∀x (r(x) → j(x))', 'All red fruits are juicy. Tranh luận được; phần lớn đúng nhưng có phản ví dụ khó tranh cãi.'), TF('(ii) ¬∃x (r(x) ∧ g(x))', false), TF('(iii) ∀x (y(x) ∨ r(x))', false), O('(iv) ∀x ((y(x) ∧ ¬j(x)) → b(x))', 'Every yellow fruit that is not juicy grows on a bush. Có lẽ sai: chuối là quả vàng, không mọng nước và không mọc trên bụi.')],
 sol:'<p>(ii) "No red fruit grows on a tree": sai, táo và anh đào. (iii) "Every fruit is yellow or red": sai, nho xanh hay việt quất.</p>'},
{n:'P4', p:'x is a positive integer. Decide the truth value of each statement.', hint:'∃ chỉ cần một ví dụ; ∀ chỉ cần một phản ví dụ để sai.',
 parts:[TF('∃x (2x = 20)', true), TF('∀x (3x = 20)', false), TF('∀x (x > 8)', false), TF('∃x (x > 8)', true)],
 sol:'<p>x = 10 làm 2x = 20. 3x = 20 không có nghiệm nguyên. x = 1 là phản ví dụ cho ∀x (x &gt; 8). x = 9 làm ∃x (x &gt; 8) đúng.</p>'},
{n:'P5-6', p:'Write English sentences which are the negations of: "All birds sing", "Some bears swim", "No dog can sing". Then express each symbolically and negate.', hint:'¬∀x P(x) ≡ ∃x ¬P(x) và ¬∃x P(x) ≡ ∀x ¬P(x).',
 parts:[O('Not (all birds sing)', 'Some birds do not sing. ∀x (b(x) → s(x)) phủ định thành ∃x (b(x) ∧ ¬s(x)).'), O('Not (some bears swim)', 'No bears swim. ∃x (B(x) ∧ w(x)) phủ định thành ∀x (B(x) → ¬w(x)).'), O('Not (no dog can sing)', 'Some dogs can sing. ∀x (d(x) → ¬s(x)) phủ định thành ∃x (d(x) ∧ s(x)).')]},
{n:'P7', p:'r(x): x ≥ 4, s(x): x ≤ 5, where x and y are integers. Which are true?', hint:'Mọi số nguyên đều ≥ 4 hoặc ≤ 5.',
 parts:[TF('(i) ∃x r(x)', true), TF('(ii) ∀y s(y)', false), TF('(iii) ∀x (r(x) ∧ s(x))', false), TF('(iv) ∃y ¬r(y)', true), TF('(v) ∃x (r(x) ∧ s(x))', true), TF('(vi) ∀x (r(x) ∨ s(x))', true)],
 sol:'<p>(v) đúng với x = 4 hoặc 5. (vi) đúng vì nếu x &lt; 4 thì x ≤ 5.</p>'},
{n:'P8', p:'Define a universe and predicates to translate into symbols. Negate (i) and (iv).', hint:'Universe: students. S(x): x sleeps too much. L(x): x is late to lectures.',
 parts:[O('(i) All students sleep too much', '∀x S(x). Phủ định: ∃x ¬S(x).'), O('(ii) All students are late to lectures', '∀x L(x)'), O('(iii) Some students sleep too much and are late', '∃x (S(x) ∧ L(x))'), O('(iv) Some students do not sleep too much', '∃x ¬S(x). Phủ định: ∀x S(x).')]}
]});

CH.push({no:6, title:'Trigonometry', vi:'Lượng giác', intro:'Có thể nhập π trực tiếp, ví dụ 7π/6 hoặc 7pi/6.', qs:[

{n:2, p:'Convert from radians to degrees.', hint:'Nhân với 180/π, tức là thay π bằng 180°.',

{n:3, p:'A silver pendant is a sector of a circle with radius 3 cm and area 6 cm². Find θ in radians.', hint:'Diện tích hình quạt = ½ r² θ.',

{n:4, p:'An oil drum of diameter 60 cm floats with chord PQ on the surface; the arc PQ under the water is 50 cm. (i) Find θ in radians. (ii) The drum is 1 metre long; find the volume below the surface.', hint:'Cung = rθ với r = 30. Phần chìm là viên phân (segment): ½ r²(θ − sin θ), rồi nhân chiều dài 100 cm.',
 parts:[N('(i) θ (rad)', 5/3, '5/3 ≈ 1.667', {tol:0.005}), N('(ii) Volume (cm³)', 30207, '≈ 30 207 cm³ (khoảng 30.2 lít)', {tol:60})],

{n:5, p:'Show sin 30° = ½, and then derive cos 30°.', hint:'Lấy tam giác đều cạnh 2, chia đôi bằng đường cao.',

 sol:'<p>Tam giác đều cạnh 2 có các góc 60°. Đường cao chia nó thành hai tam giác vuông với góc 30°, cạnh huyền 2, cạnh đối diện góc 30° bằng 1. Vậy sin 30° = 1/2. Đường cao = √(2² − 1²) = √3, nên cos 30° = √3/2.</p>'},
{n:6, p:'Given tan 45° = 1 and tan 30° = 1/√3, find without a calculator: tan 135° and tan 150°.', hint:'tan(180° − α) = −tan α. Góc phần tư thứ hai, tan âm.',

{n:7, p:'Solve 3 cos x = −0.6 for 0 ≤ x ≤ 360°, giving answers to 1 decimal place.', hint:'cos x = −0.2. cos âm ở góc phần tư II và III; nghiệm thứ hai là 360° − x₁.',

{n:8, p:'Solve tan x = −2 where x is in radians and −2π ≤ x ≤ 2π.', hint:'tan có chu kỳ π: lấy nghiệm cơ bản rồi cộng/trừ π cho tới khi ra khỏi khoảng.',

{n:9, p:'Find all solutions between 0° and 360° of cos x sin x = 3 cos x.', hint:'Đừng chia hai vế cho cos x (sẽ mất nghiệm). Chuyển vế và đặt nhân tử chung.',

var G1L = G1E.split(' ').map(function(e){ return [e[0], e[1]]; });
function inG1(e){ return G1E.split(' ').indexOf(ekey(e[0], e[1])) >= 0; }
function spanCheck(verts, edgeSetStr, weights, minW){
  return function(raw){
    var E = parseEdges(raw);
    if (!E.length) return {ok:false, msg:'Nhập các cạnh, ví dụ ab, bc, ...'};
    var allowed = edgeSetStr.split(' ');
    for (var i = 0; i < E.length; i++) if (allowed.indexOf(ekey(E[i][0], E[i][1])) < 0) return {ok:false, msg:'Cạnh ' + E[i].join('') + ' không có trong đồ thị.'};
    if (E.length !== verts.length - 1) return {ok:false, msg:'Cây khung trên ' + verts.length + ' đỉnh có đúng ' + (verts.length - 1) + ' cạnh.'};
    var cc = connectedCount(verts, E);
    if (cc.cycle || cc.parts !== 1) return {ok:false, msg:'Tập cạnh này có chu trình hoặc không nối hết các đỉnh.'};
    if (weights){ var w = E.reduce(function(s, e){ return s + weights[ekey(e[0], e[1])]; }, 0); if (w !== minW) return {ok:false, msg:'Đây là cây khung, nhưng tổng trọng số là ' + w + ', chưa nhỏ nhất.'}; }
    return {ok:true};
  };
}

 parts:[TAPE('i) B B 0 0 1 1 B B', 'BB1111BB'), TAPE('ii) B B 1 0 1 B B B', 'BB011BBB'), TAPE('iii) B B 1 1 B 0 1 B', 'BB00001B')],
 sol:'<p>(i) s0 đọc 0 → ghi 1, sang phải, s1. s1 đọc 0 → ghi 1, sang trái, s2: dừng. (iii) s0 đọc 1 → ghi 0, phải, s1. s1 đọc 1 → ghi 0, phải. s1 đọc B → ghi 0, trái, s2: dừng.</p>'}
]});
function TAPE(l, ans){
  var core = ans.replace(/^B+|B+$/g, '');
  return FN(l, function(raw){ var c = String(raw).toUpperCase().replace(/[^01B]/g, ''); return {ok: c.replace(/^B+|B+$/g, '') === core}; }, ans.split('').join(' '), 'VD: B B 1 0 1 B B B');
}

  document.addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    var sec = b.closest('.q'), q = sec ? qOf(sec.id) : null;
    if (b.classList.contains('opt')){
      var part = b.closest('.part'), pid = part.dataset.pid;
      $$('.opt', part).forEach(function(o){ o.classList.toggle('on', o === b); o.setAttribute('aria-checked', o === b); });
      state.a[pid] = b.dataset.val; delete state.st[pid]; showMark(PARTS[pid], null); save(); scoreLine(q); updateTotals(); return;
    }
    if (b.dataset.self){ var pp = b.closest('.part'); state.st[pp.dataset.pid] = b.dataset.self; showMark(PARTS[pp.dataset.pid], b.dataset.self); save(); scoreLine(q); updateTotals(); return; }
    if (b.dataset.act === 'check') return checkQ(q);
    if (b.dataset.act === 'hint') return toggle(q, 'hint', b);
    if (b.dataset.act === 'sol') return toggle(q, 'sol', b);
    if (b.dataset.act === 'clear'){
      q.parts.forEach(function(p){ delete state.a[p.id]; delete state.st[p.id]; if (p.t === 'grid') Object.keys(state.a).forEach(function(k){ if (k.indexOf(p.id + 'r') === 0) delete state.a[k]; }); });
      save(); var tmp = document.createElement('div'); tmp.innerHTML = qHTML(CH[+q.id.split('q')[0].slice(1) - 1], q); var fresh = tmp.querySelector('.q'); sec.replaceWith(fresh); scoreLine(q); updateTotals(); return;
    }
    if (b.dataset.sym != null){
      var f = lastField; if (!f || !document.body.contains(f)) return;
      var s0 = f.selectionStart != null ? f.selectionStart : f.value.length, s1 = f.selectionEnd != null ? f.selectionEnd : s0;
      f.value = f.value.slice(0, s0) + b.dataset.sym + f.value.slice(s1); f.focus(); var pos = s0 + b.dataset.sym.length; try { f.setSelectionRange(pos, pos); } catch (er) {}
      f.dispatchEvent(new Event('input', {bubbles:true})); return;
    }
    if (b.id === 'reset'){ $('#resetbox').hidden = false; return; }
    if (b.id === 'resetno'){ $('#resetbox').hidden = true; return; }
    if (b.id === 'resetyes'){ state = {a:{}, st:{}}; save(); $('#resetbox').hidden = true; render(); return; }
    if (b.id === 'symtoggle'){ var bar = $('#symbar'); bar.classList.toggle('min'); b.setAttribute('aria-expanded', !bar.classList.contains('min')); return; }
  });
  document.addEventListener('mousedown', function(e){ if (e.target.closest('[data-sym]')) e.preventDefault(); });
  window.addEventListener('hashchange', render);

  var SYMS = ['∪','∩','′','\\','∅','∈','∉','⊆','⊂','×','¬','∧','∨','→','↔','⊕','∀','∃','π','√','²','⁻¹','≥','≤','∞'];
  $('#syms').innerHTML = SYMS.map(function(s){ return '<button type="button" data-sym="' + esc(s) + '" title="Chèn ' + esc(s) + '">' + esc(s) + '</button>'; }).join('');
  render();
})();
</script>
</body></html>
